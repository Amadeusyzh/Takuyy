# Opens the SDF shader test page and the home-page Lab in Mobile Safari on the newest iPhone simulator of each
# macOS image and records what the pages report (blocking WebGL calls, lost contexts, frame gaps, the stats
# lines), screenshots and WebKit log lines. No AI and no API key involved. Triggered by pushes to
# ops/iosrun-<name>. Results go to report/<branch>-<job>.
name: iOS simulator check

on:
  push:
    branches: ["ops/iosrun-*"]

permissions:
  contents: write

jobs:
  sim:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, test: lab, runner: sim, name: m26-sim-lab }
          - { os: macos-15, test: lab, runner: sim, name: m15-sim-lab }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run in the simulator
        if: matrix.runner == 'sim'
        shell: bash
        run: bash ops/ios/run.sh "${{ matrix.test }}" "$RUNNER_TEMP/rep"
      - name: Run in Playwright WebKit
        if: matrix.runner == 'webkit'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rep"; cd ops/ios && npm init -y > /dev/null && npm install --silent playwright@latest && npx playwright install webkit > /dev/null
          P="pages/${{ matrix.test }}"; P="pages/${P#pages/page:}"
          sed -i.bak 's/var TIMEOUT = 45000;/var TIMEOUT = 150000;/' "$P"
          node wk.js "$P" 2>&1 | tee "$RUNNER_TEMP/rep/webkit.txt" || true
      - name: Publish report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REP="$RUNNER_TEMP/rep"; mkdir -p "$REP"
          cd "$REP" && git init -q && git add -A \
            && git -c user.name=ops-bot -c user.email=ops-bot@users.noreply.github.com commit -q -m "ios simulator report" \
            && git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" \
                 push -q -f "https://github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/report/${GITHUB_REF_NAME#ops/}-${{ matrix.name }}"
          echo "report pushed"
