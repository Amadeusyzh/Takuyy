# Measures Lab demo variants in Chrome on Windows, where WebGL runs on ANGLE -> Direct3D 11 and shaders are
# compiled by FXC (a different compiler from the Linux runners). No AI and no API key involved.
# Triggered by pushes to ops/win or ops/winrun-<name>; the variants are the files in ops/win/variants (env
# VARIANTS limits them). Results go to report/win or report/winrun-<name>.
name: Windows shader check

on:
  push:
    branches: ["ops/win", "ops/winrun-*"]

permissions:
  contents: write

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        shell: bash
        run: |
          cd ops/win && npm init -y >/dev/null && npm install --silent playwright@1.49.1
      - name: Measure
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/winrep
          CONFIGS: d3d11
        run: |
          cd ops/win && node measure.js 2>&1 | tee "$RUNNER_TEMP/measure.txt" || true
      - name: Compile ANGLE's HLSL with FXC
        shell: bash
        run: |
          REP="$RUNNER_TEMP/winrep"; mkdir -p "$REP"
          FXC="$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/fxc.exe | sort -V | tail -1)"
          echo "$FXC" > "$REP/fxc-path.txt"
          node ops/win/fxcprep.js "$REP/results.json" "$REP" || true
          cd "$REP"
          for O in O1 O3 Od; do
            S=$(date +%s.%N)
            MSYS_NO_PATHCONV=1 "$FXC" /nologo /T ps_5_0 /E main /$O /Fc "sdf-ps-$O.asm" sdf-ps.hlsl > "fxc-$O.log" 2>&1 || true
            E=$(date +%s.%N)
            echo "$O seconds: $(echo "$E - $S" | bc 2>/dev/null || echo "$S $E")" | tee -a fxc-times.txt
          done
          ls -la
      - name: Publish report
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REP="$RUNNER_TEMP/winrep"; mkdir -p "$REP"; cp "$RUNNER_TEMP/measure.txt" "$REP/" || true
          cd "$REP" && git init -q && git add -A \
            && git -c user.name=yangzehua -c user.email=yangzehua@akane.waseda.jp commit -q -m "windows shader report" \
            && git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
                 push -q -f "https://github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/report/${GITHUB_REF_NAME#ops/}"
          echo "report pushed"
