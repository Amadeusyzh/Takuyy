  gs_caption: 約 20 万個の 3D ガウシアンでできた、編集可能なオープンワールドです。Genie 3 や World Labs の Marble といった生成型ワールドモデルに着想を得ています。世界を言葉で描写するかプリセットを選ぶと生成されます。ここでは学習済みモデルの代わりに、キーワードベースの手続き的ジェネレーターが日本語・英語・中国語のプロンプトを読み取り、地形・湖・森・集落・天候を作ります。描画はすべて 3D Gaussian Splatting（Kerbl ら 2023）のパイプラインで行っています：共分散の EWA 射影、Web Worker での深度ソート、奥から手前へのアルファ合成です。固定されたキャプチャとは違い、ここでのガウシアンは「生きて」います。任意の時刻に合わせて GPU 上で再ライティングされ、スプラット型シャドウマップで太陽の影を落とし、風に揺れ、季節に応じて変化します。地形のガウシアンは毎フレーム、編集可能なハイトフィールドから高さ・法線・向き・材質を導き直します。地形の造形やペイント、木・岩・小屋・灯籠の配置と消去、水位を上げて谷を沈めることができ、一人称で歩き回ることもできます（「歩く」を選び、WASD で移動、ドラッグで視点）。
  gs_hint: ドラッグ：周回 · Shift/右ドラッグ：移動 · クリック後スクロール：ズーム
