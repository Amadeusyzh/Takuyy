  pt_caption: GPU のフラグメントシェーダー上で動く物理ベースのパストレーサーです。各ピクセルがコーネルボックス内で最大 8 回反射する光路を追跡します。表面は GGX マイクロファセット BRDF と可視法線分布サンプリング（Heitz 2018）、ガラスなどの誘電体は厳密な Fresnel 式による屈折で表現しています。直接光は Next Event Estimation（NEE）で推定し、多重重点的サンプリング（MIS、Veach 1995）で BSDF サンプリングと組み合わせています。BSDF / NEE / MIS を切り替えて光源を小さくすると、その効果がよく分かります。サンプルは逐次的に蓄積され、操作中は法線・深度・アルベドの G バッファに導かれたエッジ保存型 à-trous ウェーブレットデノイザー（Dammertz ら 2010）が画像をきれいにします。リアルタイムレイトレーシングの SVGF と同じ考え方です。オブジェクトをクリックすると選択して材質を編集でき、ドラッグで移動、背景ドラッグで視点回転、ダブルクリックで薄レンズカメラのピントを合わせます。
  pt_hint: クリック：選択 · ドラッグ：移動／回転 · ダブルクリック：ピント
  pt_stats: '{spp} spp · {mps} M パス/秒 · {res}'
