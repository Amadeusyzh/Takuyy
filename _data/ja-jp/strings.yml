  gs_caption: 3D ガウシアンスプラッティング（Kerbl ら、SIGGRAPH 2023）は、シーンを数百万個の異方性 3D ガウシアンで表現し、写実的な新規視点をリアルタイムに描画する手法で、AR/VR のキャプチャや世界モデルの重要な表現になっています。ここでは約 85,000 個のガウシアンで、手続き的に生成した盆栽（論文で有名な bonsai シーンへのオマージュ）を構成しています。毎フレーム、各ガウシアンの 3D 共分散を透視変換のヤコビアンで画面上の 2D 楕円に射影し（EWA スプラッティング）、全ガウシアンを深度ソート（16 ビット計数ソート）して奥から手前へアルファ合成します。1 次の視点依存色項で球面調和関数を模しているため、回転すると釉薬のかかった鉢のハイライトが動きます。表示を切り替えると、楕円体・中心点・各ピクセルの重なり数を確認できます。ドラッグで回転、クリック後にスクロールでズームできます。
  gs_hint: ドラッグで回転 · クリック後スクロールでズーム
  gs_stats: ガウシアン {n} 個 · ソート {ms} ms · {fps} fps
  intro: 研究に関連する 4 つのリアルタイムグラフィックスデモです。WebGL でゼロから実装しており、すべてブラウザ上で動作します。
