lab:
  ball: Ball
  cloth_caption: A 40 × 40 cloth simulated with Extended Position-Based Dynamics (XPBD, Macklin et al. 2016) using many small substeps, the same family of solvers found in game engines, VR, and the physics simulators that generate training data for embodied agents and world models. Drag the cloth to pull it, switch to Cut and swipe to slice it, or stretch it hard until it tears. Drag empty space to orbit the camera.
  cloth_hint: drag cloth to pull · drag background to orbit
  cloth_stats: '{p} particles · {c} constraints · {s} substeps · solver {ms} ms'
  cut: Cut
  fov_caption: Eye-tracked foveated rendering, as used in headsets such as Apple Vision Pro and Meta Quest Pro. Visual acuity drops sharply outside the fovea (about 5° of the visual field), so the scene is ray-marched at full resolution only where you look (your cursor is the simulated gaze), at 1/2 and 1/4 resolution further out, and the layers are blended together. Turn on the overlay to see the shading-rate regions. When the cursor is idle, the gaze performs simulated saccades.
  fov_hint: 'move the cursor: it is your gaze'
  fov_stats: 'shaded pixels: {pct}% of native ({x}× fewer) · {fps} fps'
