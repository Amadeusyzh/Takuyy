  grab: Grab
  gs_caption: 'An editable open world made of around 200,000 3D Gaussians, in the spirit of generative world models such as Genie 3 and World Labs'' Marble. Describe a world or pick a preset. A keyword-driven procedural generator stands in for a learned model here: it reads the prompt (in English, Chinese or Japanese) and builds the terrain, lakes, forests, villages and weather. Everything is drawn with the 3D Gaussian Splatting pipeline (Kerbl et al. 2023): EWA projection of each covariance, a depth sort in a Web Worker, and back-to-front alpha compositing. Unlike a frozen capture, the Gaussians stay live. They are relit on the GPU for any time of day, cast sun shadows through a splatted shadow map, sway in the wind and follow the seasons. Terrain Gaussians re-derive their height, normal, orientation and material from an editable heightfield every frame. You can sculpt and paint the land, place or erase trees, rocks, cabins and lanterns, flood the valley, and walk through it in first person
    (Walk, then WASD and drag to look).'
  gs_hint: 'drag: orbit · shift/right-drag: pan · click, then scroll: zoom'
  gs_stats: '{n} Gaussians · {o} objects · sort {ms} ms · {fps} fps'
