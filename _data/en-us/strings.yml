  pt_caption: A physically based path tracer running in your GPU's fragment shaders. Every pixel traces light paths with up to 8 bounces through a Cornell box. Surfaces use a GGX microfacet BRDF with visible-normal sampling (Heitz 2018), and dielectrics refract with exact Fresnel. Direct light comes from next-event estimation combined with BSDF sampling by multiple importance sampling (Veach 1995); switch between BSDF, NEE and MIS and shrink the light to see why it matters. Samples accumulate progressively, and while you interact an edge-avoiding à-trous wavelet denoiser (Dammertz et al. 2010), guided by normal, depth and albedo buffers, cleans up the image. This is the same idea behind SVGF in real-time ray tracing. Click an object to select it and edit its material, drag it to move it, drag the background to orbit, and double-click to focus the thin-lens camera.
  pt_hint: 'click: select · drag: move / orbit · double-click: focus'
