  gs_caption: 一个由约 20 万个 3D 高斯组成、可编辑的开放世界，灵感来自 Genie 3、World Labs Marble 等生成式世界模型。输入一段描述或选择预设即可生成世界——这里用一个基于关键词的程序化生成器代替学习得到的模型：它读取中文、英文或日文提示词，生成地形、湖泊、森林、村庄和天气。所有内容都按 3D Gaussian Splatting（Kerbl 等 2023）的管线渲染：协方差的 EWA 投影、在 Web Worker 中做深度排序、从后往前 alpha 合成。与冻结的采集结果不同，这里的高斯是“活”的：它们在 GPU 上按一天中任意时刻重新打光，通过泼溅式阴影贴图投射阳光阴影，随风摆动、随四季变化；地形高斯每一帧都从可编辑的高度场重新推导自己的高度、法线、朝向和材质。你可以雕刻、涂刷地形，放置或擦除树木、岩石、小木屋和灯笼，抬高水位淹没山谷，还能第一人称漫游其中（选「漫游」，WASD 移动，拖动转向）。
  gs_hint: 拖动：环视 · Shift/右键拖动：平移 · 点击后滚轮：缩放
