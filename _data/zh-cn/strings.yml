  pt_caption: 一个运行在 GPU 片元着色器里的基于物理的路径追踪器：每个像素在康奈尔盒中追踪最多 8 次弹射的光路。表面采用 GGX 微表面 BRDF 并使用可见法线分布采样（Heitz 2018），玻璃等电介质按精确 Fresnel 方程折射。直接光照用下一事件估计（NEE），并通过多重重要性采样（MIS，Veach 1995）与 BSDF 采样结合——切换 BSDF / NEE / MIS 并把光源调小，就能看出它的作用。样本逐帧渐进累积；交互时由法线、深度、反照率 G-buffer 引导的边缘保持 à-trous 小波降噪器（Dammertz 等 2010）清理画面，这与实时光追中 SVGF 的思路相同。点击物体可选中并编辑材质，拖动物体可移动，拖动背景可旋转视角，双击可让薄透镜相机对焦。
  pt_hint: 点击：选中 · 拖动：移动 / 旋转 · 双击：对焦
