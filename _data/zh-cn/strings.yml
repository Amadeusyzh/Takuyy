lab:
  ball: 小球
  cloth_caption: 一块 40 × 40 的布料，用扩展位置动力学（XPBD，Macklin 等，2016）配合大量小子步实时求解。这类求解器广泛用于游戏引擎、VR，以及为具身智能体和世界模型生成训练数据的物理仿真器。拖动布料可以拉扯它；切换到「剪切」后划过布料可以把它剪开；用力拉扯超过极限它会被撕裂。拖动空白处可以旋转视角。
  cloth_hint: 拖动布料拉扯 · 拖动背景旋转视角
  cloth_stats: '{p} 个粒子 · {c} 个约束 · {s} 个子步 · 求解 {ms} ms'
  cut: 剪切
  fov_caption: 眼动追踪注视点渲染（Foveated Rendering），Apple Vision Pro、Meta Quest Pro 等头显都在使用。人眼只有中央凹（约 5° 视野）看得最清楚，越往外视力下降越快，所以场景只在你注视的地方（鼠标位置即模拟的视线）用全分辨率光线步进渲染，外圈依次降到 1/2 和 1/4 分辨率，最后平滑融合。打开「显示分区」可以看到各个着色率区域；鼠标不动时，视线会模拟人眼的扫视（saccade）运动。
  fov_hint: 移动鼠标：它就是你的视线
  fov_stats: 着色像素：原生的 {pct}%（减少 {x} 倍）· {fps} fps
  foveation: 注视点渲染
  grab: 拉扯
  intro: 两个和我研究方向相关的实时小 demo，用 WebGL 从零手写，完全在你的浏览器里运行。
  nogl: 你的浏览器不支持 WebGL，无法运行此演示。
