    <text x="443" y="241">x&#770;&#8324;</text><text x="543" y="241">x&#770;&#8325;</text><text x="643" y="241">x&#770;&#8326;</text>
  </g>
  <g stroke="#d35400" stroke-width="2" marker-end="url(#a2)">
    <line x1="170" y1="204" x2="216" y2="204"/><line x1="270" y1="204" x2="316" y2="204"/><line x1="370" y1="204" x2="416" y2="204"/>
    <line x1="470" y1="204" x2="516" y2="204"/><line x1="570" y1="204" x2="616" y2="204"/>
  </g>
  <!-- loss bracket over the whole generated clip -->
