<?xml version="1.0" encoding="utf-8"?>
<!-- Hand-written schematic (no Python runtime in the authoring session); regenerate with
     bin/figures/world-models/world_models_updates.py. What the model is conditioned on during TRAINING:
     TF = teacher forcing (clean real past), DF = Diffusion Forcing (independent noise level per frame),
     SF = Self Forcing (its own generated past, produced autoregressively with a KV cache; loss on the whole
     generated clip). Grey level = noise level sigma (white = clean). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">
  <rect width="760" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d35400"/></marker>
  </defs>
  <g font-size="20" font-weight="bold" fill="#222" text-anchor="end">
    <text x="80" y="62">TF</text><text x="80" y="152">DF</text><text x="80" y="242">SF</text>
  </g>
  <!-- TF: real clean past, noisy target -->
  <g stroke="#1f77b4" stroke-width="2">
    <rect x="100" y="30" width="86" height="50" fill="#dbe9f6"/><rect x="200" y="30" width="86" height="50" fill="#dbe9f6"/>
    <rect x="300" y="30" width="86" height="50" fill="#dbe9f6"/><rect x="400" y="30" width="86" height="50" fill="#dbe9f6"/>
    <rect x="500" y="30" width="86" height="50" fill="#dbe9f6"/>
  </g>
  <rect x="600" y="30" width="86" height="50" fill="#858585" stroke="#333" stroke-width="2"/>
  <g text-anchor="middle" fill="#1f4e79">
    <text x="143" y="61">x&#8321;</text><text x="243" y="61">x&#8322;</text><text x="343" y="61">x&#8323;</text><text x="443" y="61">x&#8324;</text><text x="543" y="61">x&#8325;</text>
  </g>
  <text x="643" y="61" text-anchor="middle" fill="#fff">x&#8326;+&#963;&#949;</text>
  <!-- DF: independent noise level per frame -->
  <g stroke="#333" stroke-width="2">
    <rect x="100" y="120" width="86" height="50" fill="#d6d6d6"/><rect x="200" y="120" width="86" height="50" fill="#707070"/>
    <rect x="300" y="120" width="86" height="50" fill="#ebebeb"/><rect x="400" y="120" width="86" height="50" fill="#474747"/>
    <rect x="500" y="120" width="86" height="50" fill="#adadad"/><rect x="600" y="120" width="86" height="50" fill="#858585"/>
  </g>
  <g text-anchor="middle" font-size="15">
    <text x="143" y="151" fill="#222">&#963;=0.2</text><text x="243" y="151" fill="#fff">&#963;=0.7</text><text x="343" y="151" fill="#222">&#963;=0.1</text>
    <text x="443" y="151" fill="#fff">&#963;=0.9</text><text x="543" y="151" fill="#222">&#963;=0.4</text><text x="643" y="151" fill="#fff">&#963;=0.6</text>
  </g>
  <!-- SF: own generated past, autoregressive rollout -->
  <g stroke="#d35400" stroke-width="2" fill="#fbe3d0">
    <rect x="100" y="210" width="86" height="50"/><rect x="200" y="210" width="86" height="50"/><rect x="300" y="210" width="86" height="50"/>
    <rect x="400" y="210" width="86" height="50"/><rect x="500" y="210" width="86" height="50"/><rect x="600" y="210" width="86" height="50"/>
  </g>
  <g text-anchor="middle" fill="#a04000">
