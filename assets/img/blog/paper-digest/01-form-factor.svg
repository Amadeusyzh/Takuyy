<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9467bd"/></marker>
</defs>
<rect width="900" height="390" fill="#fff"/>
<!-- left panel: side view, 1 unit = 60 px, origin (120, 300) -->
<line x1="50" y1="300" x2="390" y2="300" stroke="#bbb" stroke-width="1.2"/>
<text x="394" y="305" fill="#777" font-style="italic">y</text>
<text x="120" y="322" text-anchor="middle" font-size="14" fill="#555">0</text>
<text x="240" y="322" text-anchor="middle" font-size="14" fill="#555">2</text>
<line x1="240" y1="296" x2="240" y2="304" stroke="#555"/>
<!-- ghost patch j at y = 0 -->
<line x1="100" y1="180" x2="140" y2="180" stroke="#999" stroke-width="5" stroke-dasharray="5,4"/>
<text x="120" y="168" text-anchor="middle" font-size="13" fill="#888">y=0</text>
<!-- offset arrow -->
<line x1="124" y1="150" x2="236" y2="150" stroke="#555" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="180" y="143" text-anchor="middle" font-size="15" font-style="italic" fill="#555">y</text>
<!-- connecting line r -->
<line x1="120" y1="300" x2="240" y2="180" stroke="#9467bd" stroke-width="2.2" stroke-dasharray="7,5"/>
<text x="192" y="250" fill="#9467bd" font-style="italic">r</text>
<!-- patches -->
<line x1="88" y1="300" x2="152" y2="300" stroke="#1f77b4" stroke-width="7"/>
<line x1="220" y1="180" x2="260" y2="180" stroke="#d62728" stroke-width="7"/>
<text x="74" y="296" fill="#1f77b4" font-style="italic">i</text>
<text x="268" y="176" fill="#d62728" font-style="italic">j</text>
<text x="268" y="200" fill="#d62728" font-size="15" font-style="italic">A<tspan baseline-shift="sub" font-size="11">j</tspan> = 0.1</text>
<!-- normals -->
<line x1="120" y1="300" x2="120" y2="236" stroke="#222" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="96" y="246" font-style="italic">n<tspan baseline-shift="sub" font-size="12">i</tspan></text>
<line x1="240" y1="180" x2="240" y2="240" stroke="#222" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="248" y="246" font-style="italic">n<tspan baseline-shift="sub" font-size="12">j</tspan></text>
<!-- angles (both 45 deg here) -->
<path d="M120,270 A30,30 0 0,1 141.2,278.8" fill="none" stroke="#ff7f0e" stroke-width="2"/>
<text x="138" y="266" fill="#c75f00" font-size="15" font-style="italic">&#952;<tspan baseline-shift="sub" font-size="11">i</tspan></text>
<path d="M240,210 A30,30 0 0,1 218.8,201.2" fill="none" stroke="#ff7f0e" stroke-width="2"/>
<text x="200" y="228" fill="#c75f00" font-size="15" font-style="italic">&#952;<tspan baseline-shift="sub" font-size="11">j</tspan></text>
<!-- right panel: F(y) = 4 A_j / (pi r^4), r^2 = y^2 + 4; x = 670 + 47.5 y, y_px = 330 - 32500 F -->
<g stroke="#000" stroke-opacity="0.12">
<line x1="480" y1="265" x2="860" y2="265"/><line x1="480" y1="200" x2="860" y2="200"/><line x1="480" y1="135" x2="860" y2="135"/><line x1="480" y1="70" x2="860" y2="70"/>
<line x1="575" y1="60" x2="575" y2="330"/><line x1="670" y1="60" x2="670" y2="330"/><line x1="765" y1="60" x2="765" y2="330"/>
</g>
<line x1="480" y1="330" x2="860" y2="330" stroke="#222" stroke-width="1.2"/>
<line x1="480" y1="330" x2="480" y2="60" stroke="#222" stroke-width="1.2"/>
<g font-size="14" fill="#222" text-anchor="end">
<text x="472" y="335">0</text><text x="472" y="270">0.002</text><text x="472" y="205">0.004</text><text x="472" y="140">0.006</text><text x="472" y="75">0.008</text>
</g>
<g font-size="14" fill="#222" text-anchor="middle">
<text x="480" y="350">-4</text><text x="575" y="350">-2</text><text x="670" y="350">0</text><text x="765" y="350">2</text><text x="860" y="350">4</text>
<text x="670" y="378" font-size="17" font-style="italic">y</text>
</g>
<text x="486" y="48" font-style="italic">F<tspan baseline-shift="sub" font-size="12">i&#8594;j</tspan><tspan baseline-shift="baseline"> = 4A</tspan><tspan baseline-shift="sub" font-size="12">j</tspan><tspan baseline-shift="baseline"> / (&#960; r</tspan><tspan baseline-shift="super" font-size="12">4</tspan><tspan baseline-shift="baseline">)</tspan></text>
<polyline fill="none" stroke="#9467bd" stroke-width="3" stroke-linejoin="round" points="480,319.7 503.75,314.3 527.5,305.5 551.25,290.6 563.1,279.6 575,265.4 586.9,247.0 598.75,224.1 610.6,196.3 622.5,164.5 634.4,131.2 646.25,100.9 658.1,79.3 670,71.4 681.9,79.3 693.75,100.9 705.6,131.2 717.5,164.5 729.4,196.3 741.25,224.1 753.1,247.0 765,265.4 776.9,279.6 788.75,290.6 812.5,305.5 836.25,314.3 860,319.7"/>
<circle cx="670" cy="71.4" r="6.5" fill="#d62728" stroke="#fff" stroke-width="1.5"/>
<circle cx="765" cy="265.4" r="6.5" fill="#d62728" stroke="#fff" stroke-width="1.5"/>
<text x="684" y="68" font-size="14" fill="#d62728">0.00796</text>
<text x="776" y="258" font-size="14" fill="#d62728">0.00199</text>
</svg>
