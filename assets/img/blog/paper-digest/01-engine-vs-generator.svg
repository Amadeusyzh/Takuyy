<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9467bd"/></marker>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc7ee"/><stop offset="1" stop-color="#e9f3fb"/></linearGradient>
<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fbf6a"/><stop offset="1" stop-color="#4d8f3c"/></linearGradient>
<linearGradient id="house" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0a46a"/><stop offset="1" stop-color="#a8673a"/></linearGradient>
</defs>
<rect width="900" height="440" fill="#fff"/>
<line x1="20" y1="200" x2="880" y2="200" stroke="#ddd" stroke-width="1.5"/>
<!-- (a) end-to-end -->
<text x="20" y="40" font-weight="bold">(a)</text>
<g>
<rect x="60" y="80" width="40" height="44" fill="url(#sky)" stroke="#555"/><rect x="60" y="108" width="40" height="16" fill="url(#grass)"/>
<rect x="92" y="74" width="40" height="44" fill="url(#sky)" stroke="#555"/><rect x="92" y="102" width="40" height="16" fill="url(#grass)"/>
<rect x="124" y="68" width="40" height="44" fill="url(#sky)" stroke="#555"/><rect x="124" y="96" width="40" height="16" fill="url(#grass)"/>
<text x="112" y="150" text-anchor="middle" font-style="italic">x<tspan baseline-shift="sub" font-size="13">&#8804;t</tspan></text>
</g>
<line x1="178" y1="100" x2="326" y2="100" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="330" y="60" width="160" height="80" rx="12" fill="#e8e0f5" stroke="#9467bd" stroke-width="2.5"/>
<text x="410" y="108" text-anchor="middle" font-size="22" font-style="italic">G<tspan baseline-shift="sub" font-size="15">&#952;</tspan></text>
<line x1="410" y1="16" x2="410" y2="56" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<text x="420" y="30" font-style="italic">a<tspan baseline-shift="sub" font-size="13">t</tspan></text>
<text x="410" y="170" text-anchor="middle" fill="#999" font-style="italic">s<tspan baseline-shift="sub" font-size="13">t</tspan><tspan baseline-shift="baseline"> = ?</tspan></text>
<line x1="494" y1="100" x2="636" y2="100" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<g>
<rect x="640" y="62" width="120" height="76" fill="url(#sky)" stroke="#555"/>
<rect x="640" y="110" width="120" height="28" fill="url(#grass)"/>
<rect x="668" y="88" width="34" height="28" rx="3" fill="url(#house)" opacity="0.85"/>
<circle cx="735" cy="94" r="12" fill="#3f7f35" opacity="0.8"/>
<text x="700" y="162" text-anchor="middle" font-style="italic">x<tspan baseline-shift="sub" font-size="13">t+1</tspan></text>
</g>
<!-- (b) engine + generator -->
<text x="20" y="240" font-weight="bold">(b)</text>
<line x1="155" y1="208" x2="155" y2="256" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<text x="165" y="226" font-style="italic">a<tspan baseline-shift="sub" font-size="13">t</tspan></text>
<rect x="60" y="260" width="190" height="90" rx="12" fill="#fff3e6" stroke="#ff7f0e" stroke-width="2.5"/>
<text x="155" y="297" text-anchor="middle" font-size="20" font-style="italic">f</text>
<text x="155" y="328" text-anchor="middle" font-size="16" font-style="italic">s<tspan baseline-shift="sub" font-size="12">t+1</tspan><tspan baseline-shift="baseline"> = f(s</tspan><tspan baseline-shift="sub" font-size="12">t</tspan><tspan baseline-shift="baseline">, a</tspan><tspan baseline-shift="sub" font-size="12">t</tspan><tspan baseline-shift="baseline">)</tspan></text>
<path d="M90,350 C70,395 130,400 120,354" fill="none" stroke="#ff7f0e" stroke-width="2" marker-end="url(#ah)"/>
<line x1="254" y1="305" x2="296" y2="305" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<!-- proxy render r(s) -->
<rect x="300" y="265" width="150" height="80" fill="#f4f4f4" stroke="#555"/>
<line x1="300" y1="322" x2="450" y2="322" stroke="#777" stroke-width="1.5"/>
<rect x="330" y="292" width="40" height="30" fill="none" stroke="#a8673a" stroke-width="2"/>
<path d="M326,292 L350,276 L374,292 Z" fill="none" stroke="#a8673a" stroke-width="2"/>
<rect x="400" y="300" width="22" height="22" fill="none" stroke="#3f7f35" stroke-width="2"/>
<text x="375" y="372" text-anchor="middle" font-style="italic">r(s<tspan baseline-shift="sub" font-size="13">t+1</tspan><tspan baseline-shift="baseline">)</tspan></text>
<line x1="454" y1="305" x2="496" y2="305" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="500" y="265" width="150" height="80" rx="12" fill="#e8e0f5" stroke="#9467bd" stroke-width="2.5"/>
<text x="575" y="313" text-anchor="middle" font-size="22" font-style="italic">G<tspan baseline-shift="sub" font-size="15">&#952;</tspan></text>
<line x1="575" y1="402" x2="575" y2="350" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<text x="590" y="420" font-style="italic">x<tspan baseline-shift="sub" font-size="13">&#8804;t</tspan></text>
<line x1="654" y1="305" x2="696" y2="305" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<g>
<rect x="700" y="265" width="150" height="80" fill="url(#sky)" stroke="#555"/>
<rect x="700" y="322" width="150" height="23" fill="url(#grass)"/>
<rect x="730" y="292" width="40" height="30" rx="2" fill="url(#house)"/>
<path d="M726,292 L750,276 L774,292 Z" fill="#8b3a2a"/>
<circle cx="811" cy="305" r="14" fill="#3f7f35"/>
<text x="775" y="372" text-anchor="middle" font-style="italic">x<tspan baseline-shift="sub" font-size="13">t+1</tspan></text>
</g>
<!-- state decides "what", generator decides "how" -->
<path d="M230,260 C300,212 480,212 556,261" fill="none" stroke="#9467bd" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ahp)"/>
<text x="392" y="216" text-anchor="middle" fill="#9467bd" font-size="16" font-style="italic">s<tspan baseline-shift="sub" font-size="12">t+1</tspan></text>
</svg>
